<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>eKlinix Workspace</title>
  
  <!-- Fonts: Plus Jakarta Sans for a modern, professional SaaS look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel untuk kompilasi JSX di browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- html2canvas untuk Fitur Download JPEG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Custom Scrollbar - Modern & Sleek */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    /* Animasi Halus untuk Kartu */
    .glass-card {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Scrollbar tersembunyi */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    html { scroll-behavior: smooth; }
    body { -webkit-tap-highlight-color: transparent; overflow-x: hidden; }

    /* Background Animation subtle but colorful - Professional Soft Colors */
    .bg-animate {
      background: linear-gradient(-45deg, #f0f9ff, #e0f2fe, #bae6fd, #eff6ff);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body class="antialiased bg-animate text-slate-800">
  
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      LayoutGrid, Folder, ExternalLink, Plus, Trash2, ChevronRight, Lock, 
      Unlock, LogOut, Home, Search, Globe, Info, ArrowRight, ArrowLeft, 
      Command, PlusCircle, Bell, User, MoreVertical, Activity, Loader2, Copy, Check, Pencil, AlertCircle, RefreshCw,
      Receipt, CheckSquare, Square, X, UserPlus, Download, Wallet, TrendingUp, CheckCircle2, Star, Rocket, Link, Settings
    } from 'https://esm.sh/lucide-react@0.263.1';

    // =====================================================================
    // GANTI URL DI BAWAH INI DENGAN DEPLOYMENT WEB APP ANDA YANG BARU
    // =====================================================================
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxbuovVe3amBAg2-6Rh0yeMJ8WxjuGUF63PnC7OjPw2UTbFkRHUTqSnG39i23bJmRuk/exec';

    // Bridge Fetch API
    const runGoogleScript = async (funcName, ...args) => {
      if (!GAS_URL || !GAS_URL.startsWith('http')) {
        throw new Error('URL Google Script belum diisi di kode.');
      }
      try {
        const response = await fetch(`${GAS_URL}?action=${funcName}`, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(args)
        });
        if (!response.ok) {
           if(response.status === 404) throw new Error(`HTTP 404. Script URL tidak ditemukan! Ganti GAS_URL dengan URL deploy yang baru.`);
           throw new Error(`HTTP Error: ${response.status}. Pastikan akses Web App disetel ke "Anyone".`);
        }
        const textResponse = await response.text();
        let result;
        try { result = JSON.parse(textResponse); } catch(e) { throw new Error('Respon server tidak valid.'); }
        if (result.status === 'success') return result.data;
        else throw new Error(result.message || 'Server gagal memproses permintaan.');
      } catch (error) {
        console.error('Fetch Error:', error);
        throw error;
      }
    };

    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];

    const formatRp = (angka) => {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
    };

    const App = () => {
      const [apps, setApps] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [isFadingOut, setIsFadingOut] = useState(false);
      const [loadError, setLoadError] = useState(null); 
      const [currentFolderId, setCurrentFolderId] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showAddModal, setShowAddModal] = useState(false);
      const [showEditModal, setShowEditModal] = useState(false);
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [showPaymentModal, setShowPaymentModal] = useState(false);
      const [showRevenueModal, setShowRevenueModal] = useState(false);
      
      const [password, setPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [notification, setNotification] = useState(null);
      const [typedText, setTypedText] = useState("");
      const [copied, setCopied] = useState(false);

      const [childApps, setChildApps] = useState([]);
      const [editChildApps, setEditChildApps] = useState([]);
      const [deletedChildApps, setDeletedChildApps] = useState([]);
      
      const [newApp, setNewApp] = useState({ name: '', type: 'app', url: '', parentId: null, price: '', isPro: false });
      const [editingApp, setEditingApp] = useState(null);

      // Rekap Pembayaran State
      const [payments, setPayments] = useState([]);
      const [isPayLoading, setIsPayLoading] = useState(false);
      
      // State Baru untuk Konfirmasi Pembayaran
      const [paymentConfirmDialog, setPaymentConfirmDialog] = useState(null);

      const currentMonthIndex = new Date().getMonth();
      const currentMonthStr = MONTHS[currentMonthIndex];

      useEffect(() => {
        const text = "space";
        let i = 0;
        const timer = setTimeout(() => {
          const interval = setInterval(() => {
            setTypedText(text.slice(0, i + 1));
            i++;
            if (i >= text.length) clearInterval(interval);
          }, 150);
          return () => clearInterval(interval);
        }, 600);
        return () => clearTimeout(timer);
      }, []);

      useEffect(() => {
        if (notification) {
          const timer = setTimeout(() => setNotification(null), 3000);
          return () => clearTimeout(timer);
        }
      }, [notification]);

      const fetchFreshData = async () => {
        setIsLoading(true);
        setIsFadingOut(false);
        setLoadError(null);
        try {
          const [appsData, paymentsData] = await Promise.all([
            runGoogleScript('getApps'),
            runGoogleScript('getPayments').catch(() => [])
          ]);
          setApps(appsData || []);
          setPayments(paymentsData || []);
          
          setIsFadingOut(true);
          setTimeout(() => {
            setIsLoading(false);
            setIsFadingOut(false);
          }, 800);
        } catch (err) {
          setLoadError(err.message);
          setIsLoading(false);
          setIsFadingOut(false);
        }
      };

      useEffect(() => {
        fetchFreshData();
      }, []);

      const filteredApps = useMemo(() => {
        return apps.filter(app => {
          const isRootItem = !app.parentId || app.parentId === "" || String(app.parentId).trim() === "null";
          if (!currentFolderId) return isRootItem;
          return String(app.parentId) === String(currentFolderId);
        });
      }, [apps, currentFolderId]);

      const loadPayments = async () => {
        setIsPayLoading(true);
        try {
          const data = await runGoogleScript('getPayments');
          setPayments(data || []);
        } catch (e) {
          setNotification({ type: 'error', message: 'Gagal memuat rekap pembayaran' });
        }
        setIsPayLoading(false);
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setNotification({ type: 'success', message: 'Memproses verifikasi...' });
        try {
          const isValid = await runGoogleScript('verifyPassword', password);
          if (isValid) {
            setIsAdmin(true);
            setShowLoginModal(false);
            setPassword('');
            setNotification({ type: 'success', message: 'Status Admin Aktif' });
          } else {
            setNotification({ type: 'error', message: 'Sandi Salah! Cek sel F1' });
          }
        } catch (error) {
          setNotification({ type: 'error', message: 'Error Server: ' + error.message });
        }
      };

      const handleChangePassword = async (e) => {
        e.preventDefault();
        if (!newPassword) return;
        setNotification({ type: 'success', message: 'Memperbarui spreadsheet...' });
        try {
          await runGoogleScript('changePassword', newPassword);
          setShowPasswordModal(false);
          setNewPassword('');
          setNotification({ type: 'success', message: 'Sandi F1 telah diperbarui' });
        } catch (error) {
          setNotification({ type: 'error', message: 'Gagal memperbarui sandi' });
        }
      };

      const handleAddApp = async (e) => {
        e.preventDefault();
        const folderOrAppId = Math.random().toString(36).substr(2, 9);
        const appToSave = { ...newApp, id: folderOrAppId, parentId: currentFolderId || '' }; 
        
        setShowAddModal(false);
        setNotification({ type: 'success', message: 'Menyimpan entri...' });

        try {
          await runGoogleScript('saveApp', appToSave);
          
          if (newApp.type === 'category' && childApps.length > 0) {
            const promises = childApps.map(child => {
              const childId = Math.random().toString(36).substr(2, 9);
              const childAppToSave = { name: child.name, type: 'app', url: child.url, id: childId, parentId: folderOrAppId, price: child.price, isPro: child.isPro || false };
              return runGoogleScript('saveApp', childAppToSave);
            });
            await Promise.all(promises);
          }
          await fetchFreshData();
          setNotification({ type: 'success', message: 'Berhasil disimpan' });
          setNewApp({ name: '', type: 'app', url: '', parentId: null, price: '', isPro: false });
          setChildApps([]); 
        } catch (error) {
          setNotification({ type: 'error', message: 'Gagal menyimpan data' });
        }
      };

      const handleEditApp = async (e) => {
        e.preventDefault();
        setShowEditModal(false);
        setNotification({ type: 'success', message: 'Memperbarui data...' });

        try {
          await runGoogleScript('updateApp', editingApp);
          
          if (editingApp.type === 'category') {
            const promises = [];
            deletedChildApps.forEach(id => {
              promises.push(runGoogleScript('deleteApp', id));
            });
            
            editChildApps.forEach(child => {
              if (child.isNew) {
                const newId = Math.random().toString(36).substr(2, 9);
                promises.push(runGoogleScript('saveApp', { ...child, id: newId, type: 'app', parentId: editingApp.id }));
              } else {
                promises.push(runGoogleScript('updateApp', child));
                }
            });
            await Promise.all(promises);
          }
          await fetchFreshData();
          setNotification({ type: 'success', message: 'Berhasil diperbarui' });
          setEditingApp(null);
          setEditChildApps([]);
          setDeletedChildApps([]);
        } catch (error) {
          setNotification({ type: 'error', message: 'Gagal memperbarui data' });
        }
      };

      const deleteApp = async (id) => {
        setNotification({ type: 'success', message: 'Menghapus data...' });
        try {
          await runGoogleScript('deleteApp', id);
          await fetchFreshData();
          setNotification({ type: 'success', message: 'Data berhasil dihapus' });
        } catch (error) {
          setNotification({ type: 'error', message: 'Gagal menghapus data' });
        }
      };

      const handleItemClick = (item) => {
        if (item.type === 'category') {
          setCurrentFolderId(item.id);
        } else {
          window.open(item.url.startsWith('http') ? item.url : `https://${item.url}`, '_blank');
        }
      };

      const copyToClipboard = (text) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        setCopied(true);
        setNotification({ type: 'success', message: 'No Rekening disalin!' });
        setTimeout(() => setCopied(false), 2000);
      };

      const handleTogglePaymentClick = (app, month, payRecord) => {
        if (!isAdmin) return;
        const isChecked = payRecord?.history?.[month] || false;
        setPaymentConfirmDialog({
          app: app,
          payRecord: payRecord,
          month: month,
          memberName: app.name,
          willCheck: !isChecked
        });
      };

      const executeTogglePayment = async () => {
        if (!paymentConfirmDialog) return;
        const { app, payRecord, month, willCheck } = paymentConfirmDialog;

        let updatedPay;
        let isNew = false;
        
        if (!payRecord) {
          updatedPay = {
            id: Math.random().toString(36).substr(2, 9),
            appId: 'GLOBAL',
            memberName: app.name,
            history: { [month]: willCheck }
          };
          isNew = true;
        } else {
          updatedPay = {
            ...payRecord,
            history: { ...payRecord.history, [month]: willCheck }
          };
        }

        if (isNew) {
          setPayments([...payments, updatedPay]);
        } else {
          setPayments(payments.map(p => p.id === updatedPay.id ? updatedPay : p));
        }
        
        setPaymentConfirmDialog(null);

        try {
          if (isNew) {
            await runGoogleScript('addMemberPayment', updatedPay);
          } else {
            await runGoogleScript('updateMemberPayment', updatedPay);
          }
          setNotification({ type: 'success', message: 'Status pembayaran diperbarui' });
        } catch (err) {
          setNotification({ type: 'error', message: 'Gagal update pembayaran' });
        }
      };

      const handleDownloadMultipleJPEG = async () => {
        setNotification({ type: 'success', message: 'Memproses Multi-Unduhan...' });
        try {
          const appNodes = document.querySelectorAll('.export-app-node');
          if (appNodes.length === 0) {
            setNotification({ type: 'error', message: 'Belum ada data untuk diunduh' });
            return;
          }
          for (let i = 0; i < appNodes.length; i++) {
            const node = appNodes[i];
            const appName = node.getAttribute('data-appname') || 'Aplikasi';
            const canvas = await window.html2canvas(node, { scale: 2, backgroundColor: '#f8fafc', logging: false, useCORS: true });
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            const link = document.createElement('a');
            const dateStr = new Date().toISOString().slice(0, 10);
            const safeAppName = appName.replace(/[^a-zA-Z0-9]/g, '_');
            link.download = `Rekap_${safeAppName}_${dateStr}.jpg`;
            link.href = dataUrl;
            link.click();
            await new Promise(resolve => setTimeout(resolve, 800));
          }
          setNotification({ type: 'success', message: 'Semua gambar berhasil diunduh!' });
        } catch (err) {
          console.error(err);
          setNotification({ type: 'error', message: 'Gagal membuat file JPEG' });
        }
      };

      const closeAddModal = () => {
        setShowAddModal(false);
        setChildApps([]);
        setNewApp({ name: '', type: 'app', url: '', parentId: null, price: '', isPro: false });
      };

      const closeEditModal = () => {
        setShowEditModal(false);
        setEditingApp(null);
        setEditChildApps([]);
        setDeletedChildApps([]);
      };

      const openEditModal = (item) => {
        setEditingApp({...item});
        if (item.type === 'category') {
          const children = apps.filter(a => a.parentId === item.id);
          setEditChildApps(children.map(c => ({...c, isNew: false, isPro: c.isPro === true || String(c.isPro).toUpperCase() === 'TRUE'})));
          setDeletedChildApps([]);
        }
        setShowEditModal(true);
      };

      if (loadError) {
        return (
          <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6 text-center animate-in fade-in duration-500">
            <div className="bg-white p-8 md:p-12 rounded-3xl shadow-xl border border-slate-200 max-w-lg w-full">
              <div className="w-16 h-16 bg-rose-50 rounded-2xl flex items-center justify-center text-rose-500 mx-auto mb-6 shadow-sm">
                <AlertCircle size={32} />
              </div>
              <h2 className="text-2xl font-bold text-slate-800 mb-3 tracking-tight">Koneksi Terputus</h2>
              <p className="text-slate-500 text-sm leading-relaxed mb-8 font-medium">"{loadError}"</p>
              
              {loadError.includes('404') && (
                <div className="bg-amber-50 border border-amber-200 text-amber-700 p-4 rounded-xl mb-8 text-xs font-medium text-left shadow-sm">
                  <p className="mb-2 font-bold flex items-center gap-2"><AlertCircle size={16}/> URL Google Script Tidak Ditemukan (404)</p>
                  <ul className="list-disc pl-5 space-y-1 opacity-90">
                     <li>Buka Ekstensi &gt; Apps Script di Spreadsheet Anda.</li>
                     <li>Deploy sebagai Web App baru (Akses: Anyone).</li>
                     <li>Salin URL baru tersebut dan paste ke kode `const GAS_URL`.</li>
                  </ul>
                </div>
              )}

              <div className="space-y-4">
                <button onClick={fetchFreshData} className="w-full bg-slate-900 text-white px-6 py-4 rounded-xl font-semibold text-sm hover:bg-slate-800 transition-all flex items-center justify-center gap-3 shadow-md active:scale-95">
                  <RefreshCw size={16} /> Coba Hubungkan Kembali
                </button>
              </div>
            </div>
          </div>
        );
      }

      const linkedApps = apps.filter(a => a.type === 'app');

      let grandTotalMonthly = 0;
      let grandTotalYearly = 0;

      const revenueData = linkedApps.map(app => {
        const appPrice = Number(app.price) || 0;
        const pay = payments.find(p => p.memberName === app.name);
        
        let currentMonthCount = 0;
        let yearlyCount = 0;

        if (pay) {
          if (pay.history?.[currentMonthStr]) currentMonthCount++;
          MONTHS.forEach(m => {
            if (pay.history?.[m]) yearlyCount++;
          });
        }

        const monthlyRev = currentMonthCount * appPrice;
        const yearlyRev = yearlyCount * appPrice;

        grandTotalMonthly += monthlyRev;
        grandTotalYearly += yearlyRev;

        return { ...app, appPrice, currentMonthCount, yearlyCount, monthlyRev, yearlyRev };
      });

      return (
        <div className="min-h-screen font-sans text-slate-900 selection:bg-blue-600 selection:text-white flex flex-col relative overflow-hidden">
          
          {/* Subtle Background Pattern / Glow - Made more vibrant */}
          <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[120%] md:w-full max-w-[1200px] h-[600px] opacity-70 pointer-events-none" style={{ background: 'radial-gradient(circle, rgba(14,165,233,0.15) 0%, rgba(56,189,248,0.1) 40%, rgba(255,255,255,0) 70%)' }}></div>

          {(isLoading || isFadingOut) && (
            <div className={`fixed inset-0 flex items-center justify-center bg-white/60 backdrop-blur-md z-[300] transition-opacity duration-500 ease-in-out ${isFadingOut ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}>
              <div className="flex flex-col items-center gap-3">
                <Loader2 size={40} className="animate-spin text-blue-600 drop-shadow-sm" />
                <span className="text-xs font-bold text-blue-700 tracking-widest uppercase animate-pulse">Memuat Workspace...</span>
              </div>
            </div>
          )}

          {/* HIDDEN CONTAINER FOR EXPORTS */}
          <div style={{ position: 'absolute', top: '-15000px', left: '-15000px', zIndex: -1 }}>
            <div className="font-sans text-slate-800">
              <div className="export-app-node w-[1100px] bg-slate-50 p-12 mb-10" data-appname="Semua Aplikasi">
                <div className="flex items-center gap-6 mb-10 pb-8 border-b-2 border-slate-200">
                   <div className="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600 shadow-sm">
                     <Receipt size={32} />
                   </div>
                   <div>
                     <h2 className="text-3xl font-bold text-slate-900 tracking-tight">Rekap Pembayaran</h2>
                     <p className="text-sm font-medium text-slate-500 mt-1">
                       Daftar Aplikasi dan Bulan Pembayarannya — eKlinix Workspace
                     </p>
                   </div>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                  <table className="w-full text-left border-collapse">
                    <thead className="bg-slate-50 border-b border-slate-200">
                      <tr>
                        <th className="p-4 font-bold text-slate-500 text-[12px] uppercase tracking-wider">Nama Aplikasi</th>
                        {MONTHS.map((m, mIndex) => (
                          <th key={m} className="p-4 font-bold text-slate-500 text-[12px] uppercase tracking-wider text-center w-14 border-l border-slate-200/60">{m}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {linkedApps.map((app, i) => {
                        const pay = payments.find(p => p.memberName === app.name);
                        return (
                          <tr key={app.id} className={`border-b border-slate-100 ${i % 2 === 0 ? 'bg-white' : 'bg-slate-50/50'}`}>
                            <td className="p-4 font-semibold text-slate-700 text-sm whitespace-nowrap">{app.name}</td>
                            {MONTHS.map((m, mIndex) => {
                                const isPastOrCurrent = mIndex <= currentMonthIndex;
                                const isChecked = pay?.history?.[m];
                                return (
                                  <td key={m} className="p-2 text-center border-l border-slate-200/60 align-middle">
                                     {isChecked ? (
                                        <div className={`flex flex-col items-center justify-center gap-1 mx-auto w-14 h-12 rounded-lg ${isPastOrCurrent ? 'bg-blue-50 text-blue-600 border border-blue-200' : 'bg-emerald-50 text-emerald-600 border border-emerald-200'}`}>
                                          <Link size={14} strokeWidth={2.5} />
                                          <span className="text-[8px] font-bold uppercase tracking-wider">Terbayar</span>
                                        </div>
                                     ) : (
                                        <div className={`flex flex-col items-center justify-center gap-1 mx-auto w-14 h-12 rounded-lg ${isPastOrCurrent ? 'bg-rose-50 text-rose-500 border border-rose-200' : 'bg-slate-50 text-slate-400 border border-slate-200'}`}>
                                          <Lock size={14} strokeWidth={2.5} />
                                          <span className="text-[8px] font-bold uppercase tracking-wider">Belum</span>
                                        </div>
                                     )}
                                  </td>
                                )
                            })}
                          </tr>
                        )
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          {notification && (
            <div className={`fixed top-6 left-1/2 -translate-x-1/2 z-[1000] w-[90%] md:w-auto px-6 py-4 rounded-2xl shadow-2xl flex items-center justify-center gap-3 animate-in fade-in slide-in-from-top-4 duration-300 border backdrop-blur-md ${notification.type === 'success' ? 'bg-slate-900/95 border-slate-700 text-white' : 'bg-rose-500/95 border-rose-400 text-white'}`}>
              {notification.type === 'success' ? <CheckCircle2 size={18} className="text-emerald-400" /> : <AlertCircle size={18} />}
              <span className="text-sm font-semibold tracking-wide">{notification.message}</span>
            </div>
          )}

          {/* NAVBAR - NEW PROFESSIONAL ADDITION */}
          <header className="sticky top-0 z-[100] bg-white/50 backdrop-blur-xl border-b border-white/40 shadow-sm w-full">
            <div className="max-w-[1920px] mx-auto px-4 sm:px-6 md:px-10 lg:px-14 xl:px-20 h-20 flex items-center justify-end gap-4">
              <div className="flex items-center gap-2 md:gap-3">
                {isAdmin ? (
                  <>

                             <button type="button" onClick={() => setChildApps(childApps.filter((_, i) => i !== index))} className="text-slate-400 hover:text-rose-600 bg-white hover:bg-rose-50 p-2 rounded-lg border border-slate-200 transition-all shadow-sm">
                               <Trash2 size={14} />
                             </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  <button className="w-full py-4 bg-slate-900 text-white rounded-xl font-bold shadow-md text-sm mt-6 hover:bg-slate-800 active:scale-95 transition-all">Submit ke Database</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
